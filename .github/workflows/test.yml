name: Test

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]

jobs:
  test:
    strategy:
      matrix:
        go-version: [1.25.x]
        os: [ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Build UI
        run: |
          cd ui
          npm ci
          npm run build --if-present

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Set up dependencies
        run: |
          go mod download

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.4.0
          args: --timeout=10m

      - name: Unit Tests
        run: go test -race -v $(go list ./... | grep -v /test/) -coverprofile=coverage.out

      - name: Send coverage
        uses: shogo82148/actions-goveralls@v1
        with:
          path-to-profile: coverage.out
          flag-name: Go-${{ matrix.go }}
          parallel: true

  integration-test:
    needs: test
    strategy:
      matrix:
        distro: [ 'debian:trixie', 'ubuntu:24.04' ]
        database: [ sqlite, postgres, mysql ]
        go-version: [ 1.25.x ]
        experimental: [ false ]

    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    container:
      image: ${{ matrix.distro }}
      options: --user root
      volumes:
        - /usr/local/share/ca-certificates:/usr/local/share/ca-certificates
    steps:
      - name: Container preparation
        run: |
          apt -y update
          apt-get install ca-certificates -y
          update-ca-certificates

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '24.x'

      - name: Build UI
        run: |
          cd ui
          npm ci
          npm run build --if-present

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Set up dependencies
        run: go mod download

      - name: GameAP Installation Test
        run: |
          cd cmd/gameapctl/
          go build .
          ./gameapctl --non-interactive panel install --version 4 --host=127.0.0.1 --database=${{ matrix.database}}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: logs_v4
          path: /var/log/
          retention-days: 5

  integration-test-windows:
    needs: test
    strategy:
      matrix:
        database: [ sqlite, postgres, mysql ]
        go-version: [ 1.25.x ]
        experimental: [ false ]

    runs-on: windows-latest
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: Build UI
        run: |
          cd ui
          npm ci
          npm run build --if-present

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Set up dependencies
        run: go mod download

      - name: Tests
        run: |
          sc delete nginx
          del C:\tools\nginx* -Recurse -Force
          cd .\cmd\gameapctl\
          go build .
          .\gameapctl.exe --non-interactive panel install --version=4 --host=127.0.0.1 --port=3080 --database=${{ matrix.database}}

      # Check that local users cannot modify C:\gameap
      - name: Modify C:\gameap
        shell: pwsh
        run: |
          $authenticatedUsers = 'S-1-5-11'
          $administrators = 'S-1-5-32-544'
          $users = 'S-1-5-32-545'
          # Write, Delete, DeleteSubdirectoriesAndFiles, ChangePermissions, TakeOwnership, GENERIC_WRITE and GENERIC_ALL
          $writeRights = 0x500D0156

          # C:\gameap\logs is created before gameapctl restricts C:\gameap, the new ACL has to reach it as well.
          $paths = @('C:\gameap', 'C:\gameap\logs', 'C:\gameap\web\gameap.exe', 'C:\gameap\tools\shawl\shawl.exe')
          if (Test-Path -LiteralPath 'C:\gameap\daemon') {
            $paths += 'C:\gameap\daemon'
          }

          $failed = $false

          $rootAcl = Get-Acl -LiteralPath 'C:\gameap'
          if (-not $rootAcl.AreAccessRulesProtected) {
            Write-Output '::error::C:\gameap inherits access rules from C:\'
            $failed = $true
          }

          $owner = $rootAcl.GetOwner([System.Security.Principal.SecurityIdentifier]).Value
          if ($owner -ne $administrators) {
            Write-Output "::error::C:\gameap is owned by $owner, not by Administrators"
            $failed = $true
          }

          foreach ($path in $paths) {
            icacls $path
            $rules = (Get-Acl -LiteralPath $path).GetAccessRules($true, $true, [System.Security.Principal.SecurityIdentifier])
            foreach ($rule in $rules) {
              if ($rule.AccessControlType -ne 'Allow') {
                continue
              }
              $sid = $rule.IdentityReference.Value
              if ($sid -eq $authenticatedUsers -or ($sid -eq $users -and ([int]$rule.FileSystemRights -band $writeRights))) {
                Write-Output "::error::$path grants $($rule.FileSystemRights) to $sid"
                $failed = $true
              }
            }
          }

          if ($failed) {
            exit 1
          }

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: logs_windows_v4
          path: |
            ~/AppData/Local/Temp/gameapctl*
            C:/gameap/services/*
            C:/gameap/logs/*
          retention-days: 5


  test-cache:
    needs: [test, integration-test, integration-test-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25.x

      - name: Checkout code
        uses: actions/checkout@v3
      - uses: actions/cache@v3
        with:
          # In order:
          # * Module download cache
          # * Build cache (Linux)
          # * Build cache (Mac)
          # * Build cache (Windows)
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/Library/Caches/go-build
            %LocalAppData%\go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

  finish:
    needs: [test, integration-test, integration-test-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: shogo82148/actions-goveralls@v1
        with:
          parallel-finished: true
